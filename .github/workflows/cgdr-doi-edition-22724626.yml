name: CGDR DOI edition 22724626 (one shot)
on:
  push:
    branches: [main]
    paths: [.github/workflows/cgdr-doi-edition-22724626.yml]
permissions: {}
jobs:
  publish:
    if: github.repository == 'Kot141078/advanced-global-intelligence'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Verify and publish fixed DOI-edition bytes without running CGDR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, re, stat, sys, urllib.error, urllib.parse, urllib.request, zipfile
          from pathlib import PurePosixPath
          REPO = 'Kot141078/advanced-global-intelligence'
          PARENT = '0e89356f975ed00fcce7b37e367569e30ba969da'
          URL = 'https://drive.google.com/uc?export=download&id=1wsMGLX_BAkLdJxyzDlduHaOwyzzxgC9u'
          ZIP_NAME = 'CGDR_R1_6AN_DOI_22724626_v0_1_1_PUBLIC.zip'
          ZIP_SHA = '2f299d529e22e2dfd8981ec8cd0ffa8d3a7a22d63f7f84a63c12eea2f8140e01'
          ZIP_BYTES = 541373
          BASE = 'publications/cgdr-selected-process-r1-6an/'
          TARGET = BASE + 'doi-v0.1.1/'
          DOI = '10.5281/zenodo.22724626'
          def check(v, message):
              if not v: raise RuntimeError(message)
          def digest(b): return hashlib.sha256(b).hexdigest()
          def blob(b): return hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest()
          class GoogleRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  u=urllib.parse.urlsplit(newurl)
                  check(u.scheme=='https' and (u.hostname in {'drive.google.com','drive.usercontent.google.com','docs.google.com'} or (u.hostname or '').endswith('.googleusercontent.com')), 'Unexpected public redirect')
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a,**k): raise RuntimeError('API redirect refused')
          def main():
              check(os.environ['GITHUB_REPOSITORY']==REPO and os.environ['GITHUB_REF']=='refs/heads/main', 'Wrong repository/branch')
              head=os.environ['GITHUB_SHA']; token=os.environ['GH_TOKEN']
              op=urllib.request.build_opener(GoogleRedirect())
              with op.open(urllib.request.Request(URL,headers={'User-Agent':'CGDR-DOI-publication/0.1.1'}),timeout=60) as r: payload=r.read(ZIP_BYTES+1)
              check(len(payload)==ZIP_BYTES and digest(payload)==ZIP_SHA,'Input archive size/hash mismatch')
              with zipfile.ZipFile(io.BytesIO(payload)) as z:
                  names=z.namelist(); check(len(names)==len(set(names))==131,'Inventory mismatch')
                  check(sum(x.file_size for x in z.infolist())<8_000_000,'Expansion limit')
                  for i in z.infolist():
                      p=PurePosixPath(i.filename)
                      check(not p.is_absolute() and '..' not in p.parts and '\\' not in i.filename and not i.is_dir() and str(p)==i.filename and not stat.S_ISLNK(i.external_attr>>16),'Unsafe archive path')
                  check(z.testzip() is None,'CRC mismatch')
                  files={n:z.read(n) for n in names}
              sums={}
              for line in files['SHA256SUMS.txt'].decode().splitlines():
                  h,p=line.split('  ',1); check(re.fullmatch('[0-9a-f]{64}',h) and p not in sums,'Invalid checksums'); sums[p]=h
              check(len(sums)==130 and set(sums)==set(files)-{'SHA256SUMS.txt'},'Checksum coverage')
              check(all(digest(files[p])==h for p,h in sums.items()),'Checksum mismatch')
              accepted=files['source-v0.1/MANIFEST_CURRENT_AK.json']
              check(digest(accepted)=='2c4c37d65763f08b7df2381c43400b036f4a358a65db96661c67170e3c234c49','Accepted manifest mismatch')
              manifest=json.loads(accepted); paths={'source-v0.1/code/'+r['path'] for r in manifest['files']}
              check(len(paths)==manifest['file_count']==93 and paths=={p for p in files if p.startswith('source-v0.1/code/')},'Source inventory mismatch')
              for row in manifest['files']:
                  b=files['source-v0.1/code/'+row['path']]; check(len(b)==row['bytes'] and digest(b)==row['sha256'],'Accepted source changed')
              check(DOI.encode() in files['CITATION.cff'] and json.loads(files['codemeta.json'])['identifier']==DOI,'DOI mismatch')
              api_op=urllib.request.build_opener(NoRedirect())
              def api(method,path,data=None):
                  body=None if data is None else json.dumps(data,ensure_ascii=False).encode()
                  req=urllib.request.Request('https://api.github.com/repos/'+REPO+path,data=body,method=method,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'CGDR-DOI-publication/0.1.1'})
                  with api_op.open(req,timeout=60) as r: raw=r.read(9_000_001)
                  check(len(raw)<=9_000_000,'API size limit'); return json.loads(raw)
              check(api('GET','/git/ref/heads/main')['object']['sha']==head,'Concurrent main change')
              hc=api('GET','/git/commits/'+head)
              check([x['sha'] for x in hc['parents']]==[PARENT],'Unexpected publication parent')
              old=api('GET','/contents/'+BASE.rstrip('/')+'?ref='+head)
              check(not {'doi-v0.1.1',ZIP_NAME,ZIP_NAME+'.sha256','CITATION.cff','CITATION.bib'} & {x['name'] for x in old},'Target exists')
              check(next(x['sha'] for x in old if x['name']=='README.md')=='a9c6f6b127e705520b7e0a43ab258d8c59a60dfa','Entry preimage changed')
              index='# CGDR R1.6AN — source and synthetic evidence\n\n**Ivan Kotov** · ORCID [0009-0009-6002-9845](https://orcid.org/0009-0009-6002-9845)\n\n**DOI:** [10.5281/zenodo.22724626](https://doi.org/10.5281/zenodo.22724626)\n\n**Publication version:** 0.1.1 · 12 September 2026.\n\n- [Current DOI edition](doi-v0.1.1/README.md): technical report, source, profile, evidence, licenses and byte checks.\n- [Technical report PDF](doi-v0.1.1/CGDR_R1_6AN_Technical_Report_v0_1_1.pdf).\n- [Complete public ZIP]('+ZIP_NAME+') ([SHA-256]('+ZIP_NAME+'.sha256)).\n- [Citation](CITATION.cff) and [BibTeX](CITATION.bib).\n- [Canonical work page](https://ivankotov.eu/publications/cgdr-selected-process-r1-6an/).\n\nThe DOI edition preserves all 118 original public source-package files, including the 93 accepted current-AK files and three profile files. It changes publication metadata and adds a report, not source bytes or experimental outcomes. The internal result is 18/18 episodes, 21/21 profile checkpoints, three expected synthetic effects and zero promotions. Raw diagnostic failures and inconclusive values remain visible. Independent clean-host replication and real-effect/economic measurements are not supplied by publication.\n\n## Rights and history\n\n[Research and verification permission](source-v0.1/LICENSE.md) allows examination, necessary verification changes and publication of negative findings; existing component licenses remain intact. Commercial operational use of new CGDR code is not granted by default.\n\nThe [original source disclosure](source-v0.1/README.md) and [original evidence note](v0.1/README.md) remain dated, unchanged components. Their older status/citation statements do not override the current DOI-edition metadata. This package is not the private AN execution/custody archive or a turnkey end-to-end replication kit. The historical AN attempt remains closed.\n'
              new={TARGET+p:b for p,b in files.items()}
              new[BASE+'README.md']=index.encode(); new[BASE+'CITATION.cff']=files['CITATION.cff']; new[BASE+'CITATION.bib']=files['CITATION.bib']
              new[BASE+ZIP_NAME]=payload; new[BASE+ZIP_NAME+'.sha256']=(ZIP_SHA+'  '+ZIP_NAME+'\n').encode()
              rows=[]
              for p,b in sorted(new.items()):
                  if p.endswith(('.pdf','.zip')):
                      result=api('POST','/git/blobs',{'content':base64.b64encode(b).decode(),'encoding':'base64'}); check(result['sha']==blob(b),'Binary blob mismatch')
                      rows.append({'path':p,'mode':'100644','type':'blob','sha':result['sha']})
                  else: rows.append({'path':p,'mode':'100644','type':'blob','content':b.decode('utf-8')})
              tree=api('POST','/git/trees',{'base_tree':hc['tree']['sha'],'tree':rows})
              commit=api('POST','/git/commits',{'message':'Add CGDR DOI 10.5281/zenodo.22724626 edition v0.1.1, attributed report and citation; frozen source unchanged','tree':tree['sha'],'parents':[head]})
              diff=api('GET','/compare/'+head+'...'+commit['sha'])
              check(len(diff['files'])==len(new)==136 and {x['filename'] for x in diff['files']}==set(new),'Unexpected diff paths')
              check(all(x['status']==('modified' if x['filename']==BASE+'README.md' else 'added') for x in diff['files']),'Unexpected diff status')
              check(api('GET','/git/ref/heads/main')['object']['sha']==head,'Concurrent main change before promotion')
              check(api('PATCH','/git/refs/heads/main',{'sha':commit['sha'],'force':False})['object']['sha']==commit['sha'],'Promotion failed')
              pub=api('GET','/contents/'+BASE.rstrip('/')+'?ref='+commit['sha']); st=next(x['sha'] for x in pub if x['name']=='doi-v0.1.1')
              t=api('GET','/git/trees/'+st+'?recursive=1'); check(not t.get('truncated'),'Truncated readback')
              check({x['path']:x['sha'] for x in t['tree'] if x['type']=='blob'}=={p:blob(b) for p,b in files.items()},'Published blob readback mismatch')
              check(next(x['sha'] for x in t['tree'] if x['path']=='source-v0.1')=='657c4e884aaf2a3a50811be722fdad9fe03bb5c3','Historical source tree changed')
              print(json.dumps({'status':'PASS_DOI_EDITION_PUBLISHED','doi':DOI,'commit':commit['sha'],'subtree':st,'files_verified':len(files),'zip_sha256':ZIP_SHA,'zip_git_blob':blob(payload),'pdf_git_blob':blob(files['CGDR_R1_6AN_Technical_Report_v0_1_1.pdf']),'accepted_source_unchanged':93,'runtime_executed':False,'zenodo_submitted':False},indent=2))
          try: main()
          except urllib.error.HTTPError as e:
              print('STOP_PUBLICATION_HTTP_'+str(e.code),file=sys.stderr); sys.exit(1)
          except Exception as e:
              print('STOP_PUBLICATION: '+str(e),file=sys.stderr); sys.exit(1)
          PY
